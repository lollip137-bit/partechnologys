# ============================================================
#  Push to main  ->  live on Hostinger.
#
#  Every push to `main` runs this. It SSHes into the Hostinger
#  server, pulls the new code, rebuilds the Next.js app, and
#  restarts it — so a `git push` is all it takes to update the
#  live site. No Vercel, the domain never moves.
#
#  ONE-TIME SETUP (Ali, in GitHub):
#    Repo -> Settings -> Secrets and variables -> Actions -> New
#    repository secret, add these five:
#
#      HOSTINGER_SSH_HOST   your server host/IP        (hPanel -> SSH Access)
#      HOSTINGER_SSH_USER   your SSH username          (hPanel -> SSH Access)
#      HOSTINGER_SSH_PORT   your SSH port              (usually 22 or 65002 on Hostinger)
#      HOSTINGER_SSH_KEY    a private SSH key that can log in     (see note below)
#      HOSTINGER_APP_PATH   the folder the site runs from on the server
#                           e.g. /home/uXXXXXXXX/domains/partechnologys.com/app
#
#  SSH key: on the server run `ssh-keygen -t ed25519 -f deploy_key`,
#  add `deploy_key.pub` to ~/.ssh/authorized_keys, and paste the
#  PRIVATE `deploy_key` file's contents into HOSTINGER_SSH_KEY.
#
#  The server folder (HOSTINGER_APP_PATH) must be a git clone of THIS
#  repo whose `origin` is https://github.com/Ali7849/partechnologys.git.
#  If it isn't yet, one time on the server:
#     cd <the app folder> && git init && \
#     git remote add origin https://github.com/Ali7849/partechnologys.git && \
#     git fetch origin main && git reset --hard origin/main
#
#  If your Hostinger plan has NO SSH (managed / Horizons), tell the
#  team and we'll switch this to the method your plan supports.
# ============================================================

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}      # lets you also trigger a deploy by hand from the Actions tab

concurrency:
  group: hostinger-production
  cancel-in-progress: true   # a newer push supersedes an in-flight deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd "${{ secrets.HOSTINGER_APP_PATH }}"

            echo "→ pulling latest main"
            git fetch origin main
            git reset --hard origin/main

            echo "→ installing dependencies"
            npm ci

            echo "→ building"
            npm run build

            echo "→ restarting the app"
            # Uses pm2 (the usual Hostinger Node setup). If the process is not
            # running yet, it is started. `npm start` = `next start -p 3010`.
            if command -v pm2 >/dev/null 2>&1; then
              pm2 reload par-technologys --update-env \
                || pm2 start npm --name par-technologys -- start
              pm2 save
            else
              echo "pm2 not found — if your app is managed by Hostinger's Node"
              echo "panel instead, replace this step with its restart command"
              echo "(or 'touch tmp/restart.txt' for a Passenger setup)."
              exit 1
            fi

            echo "✓ deployed"
